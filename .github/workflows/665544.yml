name: Build MusicFree Android APK
 # 支持网页手动点按钮打包，也可以push代码自动打包
 on:
   workflow_dispatch:
   push:
     branches: [ main ]
 jobs:
   build:
     runs-on: ubuntu-latest
     steps:
       # 拉取仓库代码
       - uses: actions/checkout@v4
       # 安装Node.js（Expo必须）
       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
           node-version: 20
           cache: npm
       # 安装js依赖（解决你之前node_modules缺失报错）
       - name: Install NPM dependencies
         run: npm install
       # Expo预构建，自动生成完整android原生工程
       - name: Expo prebuild android
         run: npx expo prebuild --platform android
       # 配置JDK17，Gradle8+需要JDK17
       - name: Setup JDK 17
         uses: actions/setup-java@v4
         with:
           distribution: 'temurin'
           java-version: '17'
       # 赋予gradlew执行权限，进入android目录打包
       - name: Build Debug APK
         run: |
           cd android
           chmod +x gradlew
           ./gradlew assembleDebug
       # 上传APK，打包后可以下载
       - name: Upload APK
         uses: actions/upload-artifact@v4
         with:
           name: MusicFree-APK
           path: android/app/build/outputs/apk/debug/app-debug.apk
